<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Knowledge Base</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <load src="/components/header.html" />

    <div class="container" style="padding-top: 2rem;">
        <a href="/knowledge.html" class="btn btn-outline" style="margin-bottom: 2rem;">&larr; Back to Knowledge Base</a>
        
        <article class="knowledge-article">
            <header class="article-header">
                <h1>{{ title }}</h1>
                <div class="meta">
                    <span class="tag">{{ category }}</span>
                    <span class="date">Updated: {{ date }}</span>
                </div>
            </header>

            <div class="article-content">
                <!-- Content goes here -->
                <p>Start writing your article content here...</p>
            </div>
        </article>
    </div>

    <load src="/components/footer.html" />

</body>
</html>
