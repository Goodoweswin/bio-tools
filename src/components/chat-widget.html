<!-- AI Chat Widget Component -->
<style>
    /* A quiet, system-aligned entry point that stays out of the first mobile viewport. */
    #sc-chat-toggle {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 50px;
        height: 50px;
        border: 1px solid var(--border-strong, rgba(125, 211, 252, 0.3));
        border-radius: var(--radius-sm, 3px);
        background: rgba(13, 23, 27, 0.94);
        color: var(--accent-color, #20c7b5);
        box-shadow: 0 14px 32px rgba(0, 18, 24, 0.28);
        cursor: pointer;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        transition: transform 0.2s ease, border-color 0.2s ease, background-color 0.2s ease, opacity 0.2s ease;
    }
    #sc-chat-toggle:hover {
        transform: translateY(-2px);
        border-color: var(--accent-color, #20c7b5);
        background: rgba(20, 38, 44, 0.98);
    }
    #sc-chat-toggle:focus-visible {
        outline: 2px solid var(--accent-color, #20c7b5);
        outline-offset: 3px;
    }

    /* Chat Window */
    #sc-chat-window {
        position: fixed;
        right: 24px;
        bottom: 88px;
        width: min(360px, calc(100vw - 48px));
        height: min(540px, calc(100dvh - 112px));
        background: #0d171b;
        border-radius: var(--radius-sm, 3px);
        box-shadow: 0 24px 56px rgba(0, 12, 17, 0.48);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--border-strong, rgba(125, 211, 252, 0.3));
        opacity: 0;
        pointer-events: none;
        transform: translateY(20px);
        transition: all 0.3s;
    }
    #sc-chat-window.open {
        opacity: 1;
        pointer-events: all;
        transform: translateY(0);
    }

    /* Header */
    .chat-header {
        background: rgba(20, 38, 44, 0.96);
        color: var(--text-color, #eef7fb);
        padding: 14px 15px;
        border-bottom: 1px solid var(--border-color, rgba(174, 224, 238, 0.16));
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .chat-header h3 { margin: 0; font-size: 16px; }
    .close-btn { background: none; border: none; color: var(--text-secondary, #9cb1bd); font-size: 20px; cursor: pointer; }

    /* Content Area */
    .chat-body {
        flex: 1;
        padding: 15px;
        overflow-y: auto;
        background: #0d171b;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* Auth View */
    #auth-view {
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        text-align: center;
    }
    #auth-view input {
        padding: 10px;
        margin: 10px 0;
        border: 1px solid var(--border-color, rgba(174, 224, 238, 0.16));
        border-radius: 0;
        background: #081013;
        color: var(--text-color, #eef7fb);
    }
    #auth-view button {
        padding: 10px;
        background: var(--accent-color, #20c7b5);
        color: #04211f;
        border: 1px solid var(--accent-color, #20c7b5);
        border-radius: 0;
        cursor: pointer;
    }

    /* Messages */
    .message {
        max-width: 80%;
        padding: 10px 14px;
        border-radius: 3px;
        font-size: 14px;
        line-height: 1.4;
    }
    .message.user {
        align-self: flex-end;
        background: rgba(32, 199, 181, 0.18);
        color: var(--text-color, #eef7fb);
        border: 1px solid rgba(32, 199, 181, 0.3);
        border-bottom-right-radius: 0;
    }
    .message.ai {
        align-self: flex-start;
        background: rgba(20, 38, 44, 0.9);
        border: 1px solid var(--border-color, rgba(174, 224, 238, 0.16));
        color: var(--text-color, #eef7fb);
        border-bottom-left-radius: 0;
    }
    .message.system {
        align-self: center;
        font-size: 12px;
        color: var(--muted-text, #718690);
        background: none;
        border: none;
    }

    /* Input Area */
    .chat-footer {
        padding: 10px;
        border-top: 1px solid var(--border-color, rgba(174, 224, 238, 0.16));
        display: flex;
        gap: 10px;
        background: rgba(13, 23, 27, 0.98);
    }
    .chat-footer input {
        flex: 1;
        padding: 8px;
        border: 1px solid var(--border-color, rgba(174, 224, 238, 0.16));
        border-radius: 0;
        background: #081013;
        color: var(--text-color, #eef7fb);
        outline: none;
    }
    .chat-footer button {
        background: none;
        border: none;
        color: var(--accent-color, #20c7b5);
        cursor: pointer;
        font-size: 18px;
    }
    
    /* Loading Dot */
    .typing-indicator { font-style: italic; color: var(--muted-text, #718690); font-size: 12px; margin-left: 10px; }

    @media (max-width: 768px) {
        #sc-chat-toggle {
            right: max(16px, env(safe-area-inset-right));
            bottom: max(16px, env(safe-area-inset-bottom));
            width: 46px;
            height: 46px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
        }
        .chat-trigger-visible #sc-chat-toggle {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }
        #sc-chat-window {
            right: 15px;
            left: 15px;
            bottom: calc(max(16px, env(safe-area-inset-bottom)) + 58px);
            width: auto;
            height: min(560px, calc(100dvh - 96px));
        }
    }
</style>

<div id="sc-chat-widget">
    <!-- Toggle Button -->
    <button id="sc-chat-toggle" type="button" onclick="toggleChat()" aria-label="Open research assistant" title="Open research assistant">
        <i class="fas fa-robot"></i>
    </button>

    <!-- Window -->
    <div id="sc-chat-window">
        <div class="chat-header">
            <h3><i class="fas fa-dna"></i> Bio-Assistant</h3>
            <button class="close-btn" onclick="toggleChat()">&times;</button>
        </div>

        <!-- Auth Screen -->
        <div id="auth-view" class="chat-body">
            <p>Please enter access password:</p>
            <input type="password" id="chat-password" placeholder="Password" onkeypress="handleAuthKey(event)">
            <button onclick="authenticate()">Start Chat</button>
        </div>

        <!-- Chat Screen -->
        <div id="chat-view" class="chat-body" style="display: none;">
            <div id="messages-container">
                <div class="message ai">Hello! I am your Single-Cell research assistant. Ask me anything about the projects.</div>
            </div>
            <div id="typing-status" class="typing-indicator" style="display: none;">AI is thinking...</div>
        </div>

        <div id="input-area" class="chat-footer" style="display: none;">
            <input type="text" id="chat-input" placeholder="Type a question..." onkeypress="handleChatKey(event)">
            <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>
</div>

<script>
    // CONFIGURATION - REPLACE THIS WITH YOUR WORKER URL
    const API_ENDPOINT = "/api/chat"; // Relative path for Pages Functions

    // State
    let isOpen = false;
    let password = localStorage.getItem('sc_chat_password') || '';

    // Initialize
    if (password) {
        showChatInterface();
    }

    function syncChatTriggerVisibility() {
        const compactViewport = window.matchMedia('(max-width: 768px)').matches;
        document.documentElement.classList.toggle('chat-trigger-visible', !compactViewport || window.scrollY > 180);
    }

    function toggleChat() {
        isOpen = !isOpen;
        const win = document.getElementById('sc-chat-window');
        if (isOpen) win.classList.add('open');
        else win.classList.remove('open');
    }

    window.addEventListener('scroll', syncChatTriggerVisibility, { passive: true });
    window.addEventListener('resize', syncChatTriggerVisibility);
    syncChatTriggerVisibility();

    function handleAuthKey(e) {
        if (e.key === 'Enter') authenticate();
    }

    function authenticate() {
        const input = document.getElementById('chat-password');
        if (input.value.trim()) {
            password = input.value.trim();
            localStorage.setItem('sc_chat_password', password);
            showChatInterface();
        }
    }

    function showChatInterface() {
        document.getElementById('auth-view').style.display = 'none';
        document.getElementById('chat-view').style.display = 'flex';
        document.getElementById('input-area').style.display = 'flex';
    }

    function handleChatKey(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        // Add User Message
        addMessage(text, 'user');
        input.value = '';

        // Show Loading
        const loading = document.getElementById('typing-status');
        loading.style.display = 'block';

        try {
            const response = await fetch(API_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Basic ' + btoa('user:' + password)
                },
                body: JSON.stringify({ question: text })
            });

            loading.style.display = 'none';

            if (response.status === 401) {
                addMessage("Incorrect password. Please try again.", 'system');
                localStorage.removeItem('sc_chat_password');
                setTimeout(() => {
                    document.getElementById('auth-view').style.display = 'flex';
                    document.getElementById('chat-view').style.display = 'none';
                    document.getElementById('input-area').style.display = 'none';
                }, 2000);
                return;
            }

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.error || `API Error: ${response.status}`);
            }

            const data = await response.json();
            addMessage(data.answer, 'ai');

        } catch (error) {
            loading.style.display = 'none';
            addMessage(`Error: ${error.message}`, 'system');
            console.error(error);
        }
    }

    function addMessage(text, type) {
        const container = document.getElementById('messages-container');
        const div = document.createElement('div');
        div.className = `message ${type}`;
        
        // Simple Markdown parsing for AI response
        if (type === 'ai') {
            // Convert **bold** to <b>
            let html = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            // Convert * to bullet points if at start of line
            html = html.replace(/^\* (.*)/gm, '• $1');
            // Convert newlines
            html = html.replace(/\n/g, '<br>');
            div.innerHTML = html;
        } else {
            div.textContent = text;
        }
        
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }
</script>
