<style>
  #sc-chat-toggle {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: #fff;
    color: var(--accent-color);
    box-shadow: 0 3px 14px #203b2912;
    cursor: pointer;
    z-index: 50;
    font-size: 18px;
  }
  #sc-chat-toggle:hover {
    background: var(--bg-secondary);
  }
  #sc-chat-window {
    position: fixed;
    right: 20px;
    bottom: 76px;
    width: min(360px, calc(100% - 40px));
    height: min(520px, calc(100dvh - 110px));
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    background: #fff;
    box-shadow: 0 12px 40px #203b2920;
    z-index: 50;
    overflow: hidden;
  }
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-color);
  }
  .chat-header h2 {
    font-size: 1rem;
  }
  .chat-close {
    width: 40px;
    height: 40px;
    border: 0;
    background: none;
    color: var(--text-secondary);
    cursor: pointer;
  }
  .chat-body {
    flex: 1;
    min-height: 0;
    padding: 16px;
    overflow-y: auto;
  }
  #auth-view {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
  }
  #auth-view label {
    font-size: 0.9rem;
  }
  #auth-view input,
  .chat-footer input {
    min-width: 0;
    padding: 10px;
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    color: var(--text-color);
    background: #fff;
  }
  #messages-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .message {
    max-width: 92%;
    padding: 10px 12px;
    border-radius: 3px;
    font-size: 0.88rem;
    line-height: 1.6;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  .message.ai {
    background: var(--bg-secondary);
    align-self: flex-start;
  }
  .message.user {
    background: #e3eee8;
    align-self: flex-end;
  }
  .message.system {
    color: #854637;
    padding: 6px 0;
  }
  .chat-footer {
    display: flex;
    padding: 12px;
    gap: 8px;
    border-top: 1px solid var(--border-color);
  }
  .chat-footer input {
    flex: 1;
    width: 0;
    font-size: 0.9rem;
  }
  .chat-footer button {
    width: 44px;
    background: var(--accent-color);
    color: #fff;
    border: 0;
    border-radius: 3px;
  }
  #typing-status {
    font-size: 0.8rem;
    color: var(--muted-text);
    padding-top: 12px;
  }
  @media (max-width: 700px) {
    #sc-chat-toggle {
      right: 14px;
      bottom: max(14px, env(safe-area-inset-bottom));
    }
    #sc-chat-window {
      right: 14px;
      width: calc(100% - 28px);
      bottom: calc(max(14px, env(safe-area-inset-bottom)) + 54px);
    }
  }
</style>
<div id="sc-chat-widget">
  <button
    id="sc-chat-toggle"
    type="button"
    onclick="toggleChat()"
    aria-label="Open research assistant"
    title="Open research assistant"
    aria-controls="sc-chat-window"
    aria-expanded="false"
  >
    <i class="fas fa-comment-dots" aria-hidden="true"></i>
  </button>
  <div id="sc-chat-window" role="dialog" aria-labelledby="chat-title" hidden>
    <div class="chat-header">
      <h2 id="chat-title">Research assistant</h2>
      <button
        class="chat-close"
        type="button"
        onclick="toggleChat()"
        aria-label="Close assistant"
        title="Close assistant"
      >
        <i class="fas fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <div id="auth-view" class="chat-body">
      <label for="chat-password">Access password</label>
      <input
        type="password"
        id="chat-password"
        autocomplete="current-password"
        onkeydown="handleAuthKey(event)"
      />
      <button class="button" type="button" onclick="authenticate()">
        Start chat <i class="fas fa-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
    <div id="chat-view" class="chat-body" hidden>
      <div
        id="messages-container"
        role="log"
        aria-label="Conversation"
        aria-live="polite"
      >
        <div class="message ai">
          Hello. What would you like to know about the research?
        </div>
      </div>
      <div id="typing-status" role="status" hidden>Thinking...</div>
    </div>
    <div id="input-area" class="chat-footer" hidden>
      <label class="sr-only" for="chat-input">Your question</label>
      <input
        type="text"
        id="chat-input"
        placeholder="Your question"
        onkeydown="handleChatKey(event)"
      />
      <button
        id="chat-send"
        type="button"
        onclick="sendMessage()"
        aria-label="Send message"
        title="Send message"
      >
        <i class="fas fa-paper-plane" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>
<script>
  const API_ENDPOINT = "/api/chat";
  let isOpen = false;
  let sending = false;
  let password = "";
  try {
    password = localStorage.getItem("sc_chat_password") || "";
  } catch {}
  if (password) showChatInterface();

  function toggleChat() {
    isOpen = !isOpen;
    document.getElementById("sc-chat-window").hidden = !isOpen;
    const trigger = document.getElementById("sc-chat-toggle");
    trigger.setAttribute("aria-expanded", String(isOpen));
    trigger.setAttribute(
      "aria-label",
      isOpen ? "Close research assistant" : "Open research assistant",
    );
    trigger.title = isOpen
      ? "Close research assistant"
      : "Open research assistant";
    if (isOpen)
      document
        .getElementById(password ? "chat-input" : "chat-password")
        .focus();
    else trigger.focus();
  }
  document
    .getElementById("sc-chat-window")
    .addEventListener("keydown", (event) => {
      if (event.key === "Escape" && isOpen) {
        event.stopPropagation();
        toggleChat();
      }
    });
  function handleAuthKey(event) {
    if (event.key === "Enter") authenticate();
  }
  function authenticate() {
    const input = document.getElementById("chat-password");
    if (!input.value.trim()) {
      input.focus();
      return;
    }
    password = input.value.trim();
    try {
      localStorage.setItem("sc_chat_password", password);
    } catch {}
    input.value = "";
    showChatInterface();
    document.getElementById("chat-input").focus();
  }
  function showChatInterface() {
    document.getElementById("auth-view").hidden = true;
    document.getElementById("chat-view").hidden = false;
    document.getElementById("input-area").hidden = false;
  }
  function handleChatKey(event) {
    if (event.key === "Enter" && !event.isComposing) sendMessage();
  }
  async function sendMessage() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text || sending) return;
    sending = true;
    document.getElementById("chat-send").disabled = true;
    addMessage(text, "user");
    input.value = "";
    const loading = document.getElementById("typing-status");
    loading.hidden = false;
    try {
      const response = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Basic " + btoa("user:" + password),
        },
        body: JSON.stringify({ question: text }),
      });
      if (response.status === 401) {
        password = "";
        try {
          localStorage.removeItem("sc_chat_password");
        } catch {}
        document.getElementById("auth-view").hidden = false;
        document.getElementById("chat-view").hidden = true;
        document.getElementById("input-area").hidden = true;
        const authInput = document.getElementById("chat-password");
        authInput.setCustomValidity("Incorrect password. Please try again.");
        if (isOpen) {
          authInput.focus();
          authInput.reportValidity();
        }
        return;
      }
      if (!response.ok)
        throw new Error(
          "The assistant is unavailable. Please try again later.",
        );
      const data = await response.json();
      addMessage(
        data.answer || "No answer was returned. Please try again.",
        "ai",
      );
    } catch (error) {
      addMessage(error.message, "system");
    } finally {
      sending = false;
      loading.hidden = true;
      document.getElementById("chat-send").disabled = false;
    }
  }
  document
    .getElementById("chat-password")
    .addEventListener("input", (event) => event.target.setCustomValidity(""));
  function addMessage(text, type) {
    const container = document.getElementById("messages-container");
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;
    container.appendChild(message);
    const body = document.getElementById("chat-view");
    body.scrollTop = body.scrollHeight;
  }
</script>
