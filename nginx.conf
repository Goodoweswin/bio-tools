server {
    listen 80;
    server_name daiger870.top;

    # 指向自动部署的离线目录
    root /home/cy410080/biotools_offline_deploy/public;
    index index.html;

    # 关键优化: 开启 Gzip 压缩
    # Pyodide 的 .wasm 和 .whl 文件很大，Gzip 能减少 50% 以上传输量
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml application/wasm;

    # 适当增大缓冲区
    client_max_body_size 50M;

    # 静态资源缓存配置
    location /tools/assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
