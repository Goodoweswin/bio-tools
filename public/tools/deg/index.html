<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>DEG Analysis | Jackson Dai BioTools</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23081013%22/><path d=%22M22 68L48 18L78 68H62L48 40L36 68Z%22 fill=%22%2320c7b5%22/></svg>">
    <link rel="stylesheet" href="../assets/stlite/stlite.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --tool-primary: #20c7b5;
            --tool-text: #eef7fb;
            --tool-muted: #9cb1bd;
            --tool-bg: #081013;
            --tool-panel: rgba(15, 29, 34, 0.78);
            --tool-border: rgba(174, 224, 238, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Aptos", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--tool-text);
            background:
                radial-gradient(circle at 12% 8%, rgba(32, 199, 181, 0.12), transparent 28rem),
                linear-gradient(180deg, #081013 0%, #0a1317 48%, #071014 100%);
        }

        .topbar {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            width: min(100% - 40px, 1180px);
            margin: 0 auto;
        }

        .brand,
        .tool-link {
            color: var(--tool-muted);
            text-decoration: none;
        }

        .brand {
            color: var(--tool-text);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .brand span,
        .tool-link:hover {
            color: var(--tool-primary);
        }

        #loading {
            width: min(100% - 40px, 760px);
            min-height: calc(100vh - 72px);
            margin: 0 auto;
            display: grid;
            place-items: center;
            text-align: center;
        }

        .loader-card {
            width: 100%;
            padding: clamp(2rem, 6vw, 4rem);
            border: 1px solid var(--tool-border);
            border-radius: 6px;
            background: var(--tool-panel);
            box-shadow: 0 28px 80px rgba(0, 18, 24, 0.45);
        }

        .spinner {
            border: 4px solid rgba(125, 211, 252, 0.12);
            border-top: 4px solid var(--tool-primary);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.25rem;
        }

        h1 {
            margin-bottom: 0.75rem;
            font-size: clamp(2.3rem, 5vw, 4rem);
            line-height: 1.08;
        }

        p,
        #status {
            color: var(--tool-muted);
            line-height: 1.6;
        }

        #status {
            margin-top: 1rem;
            color: var(--tool-primary);
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 640px) {
            .topbar {
                align-items: flex-start;
                flex-direction: column;
                padding: 1rem 0;
            }
        }
    </style>
</head>

<body>
    <nav class="topbar">
        <a href="/" class="brand">Jackson Dai <span>BioTools</span></a>
        <a href="/tools" class="tool-link"><i class="fas fa-arrow-left"></i> Tools</a>
    </nav>

    <div id="loading">
        <div class="loader-card">
            <div class="spinner"></div>
            <h1>DEG Analysis</h1>
            <p>Interactive volcano plotting for differential expression results. The Python runtime runs in your browser.</p>
            <div id="status">Loading components...</div>
        </div>
    </div>

    <div id="root"></div>

    <!-- 引用本地 Stlite 核心 JS -->
    <script src="../assets/stlite/stlite.js"></script>

    <script>
        const statusDiv = document.getElementById('status');
        const debugMode = true; // 开启调试日志

        function log(msg) {
            if (debugMode) console.log("[App Loader]", msg);
            statusDiv.innerText = msg;
        }

        async function loadApp() {
            try {
                log("Loading Python script...");

                // 1. 获取主程序代码
                const appResp = await fetch('./app.py?v=' + Date.now());
                if (!appResp.ok) throw new Error(`无法加载 app.py: ${appResp.statusText}`);
                const appCode = await appResp.text();

                // 2. 获取共享样式代码 (Nature Style)
                // 注意：路径是相对于当前 HTML 文件的
                const styleResp = await fetch('../common/nature_style.py?v=' + Date.now());
                let styleCode = "";
                if (styleResp.ok) {
                    styleCode = await styleResp.text();
                } else {
                    console.warn("无法加载 nature_style.py，将使用默认样式");
                    styleCode = "# nature_style.py failing fallback\ndef set_nature_style(): pass";
                }

                log("Starting Python runtime...");

                // 3. 挂载 Stlite
                stlite.mount({
                    requirements: [
                        "pandas",
                        "matplotlib",
                        "seaborn",
                        "scipy",
                        "plotly",  // [NEW] Added for interactive volcano plot
                        "openpyxl",
                        "lxml",
                        // Keep local wheels for specific needs if any, reusing from stat_analysis
                        "/tools/assets/pypi/interface_meta-1.3.0-py3-none-any.whl",
                        "/tools/assets/pypi/formulaic-0.2.4-py3-none-any.whl",
                        "/tools/assets/pypi/python_docx-1.2.0-py3-none-any.whl",
                        "/tools/assets/pypi/et_xmlfile-2.0.0-py3-none-any.whl",
                        "/tools/assets/pypi/openpyxl-3.1.5-py2.py3-none-any.whl"
                    ],
                    entrypoint: "app.py",
                    files: {
                        "app.py": appCode,
                        "nature_style.py": styleCode
                    },
                    // 配置 Pyodide 路径 - 使用官方 jsdelivr (需 VPN)
                    pyodideUrl: "https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"
                }, document.getElementById("root"));

                // 移除 loading 界面
                document.getElementById("loading").style.display = 'none';

            } catch (err) {
                console.error(err);
                statusDiv.innerHTML = `<span style="color:#ff8a5b">Startup failed: ${err.message}</span>`;
            }
        }

        loadApp();
    </script>
</body>

</html>
