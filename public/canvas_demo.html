<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Grid Animation Demo - ElementPrism Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            overflow-x: hidden;
        }

        /* Canvas 背景 */
        #grid-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Hero 区域 */
        .hero {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            z-index: 1;
        }

        /* 玻璃拟态卡片 */
        .glass-card {
            background: rgba(16, 185, 129, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 24px;
            padding: 3rem;
            max-width: 600px;
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.1);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {

            0%,
            100% {
                filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.5));
            }

            50% {
                filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.8));
            }
        }

        .subtitle {
            color: #8b949e;
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.5);
        }

        /* 性能指标 */
        .performance {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 8px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.9rem;
            z-index: 10;
        }

        .performance div {
            margin-bottom: 0.5rem;
        }

        .performance .label {
            color: #8b949e;
        }

        .performance .value {
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <!-- Canvas 背景 -->
    <canvas id="grid-canvas"></canvas>

    <!-- 性能监控 -->
    <div class="performance">
        <div><span class="label">FPS:</span> <span class="value" id="fps">60</span></div>
        <div><span class="label">Particles:</span> <span class="value" id="particles">0</span></div>
        <div><span class="label">CPU:</span> <span class="value" id="cpu">Low</span></div>
    </div>

    <!-- Hero 内容 -->
    <div class="hero">
        <div class="glass-card">
            <h1>ElementPrism</h1>
            <p class="subtitle">One-Click Publication-Ready Figures for Biologists</p>
            <a href="#" class="btn">🚀 Launch Tool</a>
        </div>
    </div>

    <script>
        // Canvas 网格动画
        const canvas = document.getElementById('grid-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];
        let lastTime = performance.now();
        let fps = 60;

        // 响应式 Canvas 尺寸
        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // 粒子类（光点）
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.radius = Math.random() * 2 + 1;
                this.opacity = Math.random() * 0.5 + 0.3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // 边界反弹
                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(16, 185, 129, ${this.opacity})`;
                ctx.fill();
            }
        }

        // 初始化粒子
        function initParticles() {
            particles = [];
            const particleCount = Math.min(50, Math.floor(width * height / 10000)); // 根据屏幕大小调整
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
            document.getElementById('particles').textContent = particles.length;
        }
        initParticles();
        window.addEventListener('resize', initParticles);

        // 绘制网格
        function drawGrid() {
            const gridSize = 50;
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.05)';
            ctx.lineWidth = 1;

            // 垂直线
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            // 水平线
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        // 连接粒子
        function connectParticles() {
            const maxDistance = 150;
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.1)';
            ctx.lineWidth = 0.5;

            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < maxDistance) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.globalAlpha = 1 - distance / maxDistance;
                        ctx.stroke();
                        ctx.globalAlpha = 1;
                    }
                }
            }
        }

        // 动画循环
        function animate() {
            // FPS 计算
            const now = performance.now();
            fps = Math.round(1000 / (now - lastTime));
            lastTime = now;
            document.getElementById('fps').textContent = fps;

            // CPU 负载估算
            if (fps > 50) {
                document.getElementById('cpu').textContent = 'Low ✅';
            } else if (fps > 30) {
                document.getElementById('cpu').textContent = 'Medium ⚠️';
            } else {
                document.getElementById('cpu').textContent = 'High ❌';
            }

            // 清空画布
            ctx.clearRect(0, 0, width, height);

            // 绘制网格
            drawGrid();

            // 更新和绘制粒子
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // 连接粒子
            connectParticles();

            requestAnimationFrame(animate);
        }

        // 启动动画
        animate();

        // 尊重用户的减少动画偏好
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            ctx.clearRect(0, 0, width, height);
            drawGrid(); // 只绘制静态网格
        }
    </script>
</body>

</html>
